arduino:
  peripheral:
    ftdi: B0005AVT
    fqbn: arduino:avr:nano
    core: arduino:avr
    sketch: sketches/peripheral
    libraries:
      - servo
    sensors:
      - type: pressure
        tag: P
        topic: /sensors/depth
      - type: voltage
        tag: V
        topic: /sensors/voltage
      - type: temperature
        tag: TS
        topic: /sensors/temperature/signal
      - type: temperature
        tag: TB
        topic: /sensors/temperature/battery
      - type: humidity
        tag: HS
        topic: /sensors/humidity/signal
      - type: humidity
        tag: HB
        topic: /sensors/humidity/battery
    servos:
      - name: marker dropper
        tag: M
        service_name: /servos/marker_dropper
        type: discrete
        states:
          one: 1300
          two: 1700
          reset: 1500
        min_delay: 3.0
  thruster:
    ftdi: AQ02V0UK
    fqbn: arduino:avr:nano
    core: arduino:avr
    sketch: sketches/thruster
    libraries:
      - "'Adafruit BusIO'"
gyro:
  ftdi: FT81SUWZ
  zero_bias: 0.0024940463
  scale_factor: 15497811.0
  negate: true
modem:
  ftdi: CP2102
thrusters:
  - name: front_right
    cw: false
    standard_esc: false
  - name: middle_right_first
    cw: false
    standard_esc: true
  - name: middle_right_second
    cw: true
    standard_esc: false
  - name: back_right
    cw: false
    standard_esc: true
  - name: back_left
    cw: true
    standard_esc: true
  - name: middle_left_first
    cw: false
    standard_esc: true
  - name: middle_left_second
    cw: true
    standard_esc: true
  - name: front_left
    cw: true
    standard_esc: true
