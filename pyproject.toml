[tool.ruff]
line-length = 120
target-version = "py312"
lint.flake8-quotes.inline-quotes = "single"
lint.pydocstyle.convention = "google"
lint.isort.relative-imports-order = "closest-to-furthest"
lint.select = [
    # Include all the rules, including new ones
    "ALL",

    # Include these rules, even though they are not enabled by default when
    # using the google convention with pydocstyle
    "D213",
    "D400",
    "D401"
]
lint.ignore = [
    # Modules
    "C90", # mccabe complexity
    "DJ",  # django
    "FBT", # flake8-boolean-trap
    "T20", # flake8-print

    # Specific Rules
    "ANN",
    "ARG",
    "ASYNC109",
    "BLE001",
    "CPY001", # new Ruff copyright-header rule; repo does not use file headers
    "D",
    "E501",
    "ERA001",
    "F821",
    "FIX002",
    "G004",
    "INP001",
    "N802",
    "N803",
    "N806",
    "PTH",
    "PGH004",
    "PLC0415",
    "PLR",
    "RUF003",
    "S101",
    "S110",
    "SIM108",
    "TD002",
    "TD003",
    "TD004",
    "TRY003",
    "TRY300",
]

[tool.pyright]
exclude = [
    "**/build/*",
    "**/install/*",
    "**/log/*",
    "**/bag_files/*",
    "**/node_modules/*",
    "**/dist/*",
]