[tool.ruff]
line-length = 120
target-version = "py312"
lint.flake8-quotes.inline-quotes = "single"
lint.pydocstyle.convention = "google"
lint.isort.relative-imports-order = "closest-to-furthest"
lint.select = [
    # Include all the rules, including new ones
    "ALL",

    # Include these rules, even though they are not enabled by default when
    # using the google convention with pydocstyle
    "D213",
    "D400",
    "D401"
]
lint.ignore = [
    # Modules
    "C90", # mccabe complexity
    "DJ",  # django
    "FBT", # flake8-boolean-trap
    "T20", # flake8-print

    # Specific Rules
    "ANN002",
    "ANN003",
    "ASYNC109",
    "CPY001", # copyright notice in the header
    "D100",
    "D104",
    "D107",
    "D212",
    "FIX002",
    "G004",
    "INP001",
    "N802",
    "N806", # team convention: ALL_CAPS for local "constant" values within a function
    "PGH004",
    "PLR0912",
    "PLR0913",
    "PLR0917", # coordinate/tuple-style constructors (e.g. create_pose) are naturally positional
    "S101",
    "TD002",
    "TD003",
    "TRY003",
]

[tool.pyright]
exclude = [
    "**/build/*",
    "**/install/*",
    "**/log/*",
    "**/bag_files/*",
    "**/node_modules/*",
    "**/dist/*",
]