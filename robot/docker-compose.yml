services:
  robosub-ros2:
    extends:
      file: ../docker-compose.yml
      service: robosub-ros2
    image: robosub-ros2:latest
    tty: true
    privileged: true
    network_mode: host
    runtime: "${ROBOT_DOCKER_RUNTIME:-runc}"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}"
    volumes:
      - /dev:/dev
      # Set the host executable path on Jetson; /dev/null keeps x86 hosts usable.
      - type: bind
        source: ${TEGRASTATS_HOST_PATH:-/dev/null}
        target: /usr/local/bin/tegrastats
        read_only: true
        bind:
          create_host_path: false
