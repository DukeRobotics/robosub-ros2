services:
  robosub-ros2:
    extends:
      file: ../docker-compose.yml
      service: robosub-ros2
    image: robosub-ros2:latest
    tty: true
    privileged: true
    network_mode: host
    group_add:
      - "${JETSON_GPIO_GID:-${USER_GID:-1000}}"
    runtime: "${ROBOT_DOCKER_RUNTIME:-runc}"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}"
    volumes:
      - /dev:/dev
